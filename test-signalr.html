<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba SignalR</title>
    <!-- Cargamos la librería oficial de SignalR desde un CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #log { background: #1e1e1e; color: #00ff00; padding: 10px; height: 300px; overflow-y: auto; font-family: monospace; }
        .error { color: #ff5555; }
        .success { color: #55ff55; }
        .info { color: #55aaff; }
    </style>
</head>
<body>
    <h2>Cliente de Prueba SignalR</h2>
    <p>Estado: <strong id="status">Desconectado</strong></p>
    <div id="log"></div>

    <script>
        const logEl = document.getElementById('log');
        const statusEl = document.getElementById('status');

        function log(msg, type = 'info') {
            const div = document.createElement('div');
            div.className = type;
            div.textContent = `[${new Date().toLocaleTimeString()}] ${msg}`;
            logEl.appendChild(div);
            logEl.scrollTop = logEl.scrollHeight;
        }

        // Configura la conexión al Hub
        // IMPORTANTE: Asegúrate de que el puerto sea el correcto (5227 u otro)
        const connection = new signalR.HubConnectionBuilder()
            .withUrl("http://localhost:5227/hubs/notifications", {
                skipNegotiation: true,
                transport: signalR.HttpTransportType.WebSockets
            }) 
            .configureLogging(signalR.LogLevel.Information)
            .build();

        // Escuchar el evento que configuramos en el backend
        connection.on("ReceiveBitacoraNotification", (payload) => {
            log(`¡NOTIFICACIÓN RECIBIDA! Datos: ${JSON.stringify(payload)}`, 'success');
        });

        // Iniciar la conexión
        async function start() {
            try {
                log("Conectando...");
                await connection.start();
                statusEl.textContent = "Conectado";
                statusEl.style.color = "green";
                log("Conectado exitosamente. Esperando notificaciones...", 'success');
            } catch (err) {
                statusEl.textContent = "Error al conectar";
                statusEl.style.color = "red";
                log(err.toString(), 'error');
                setTimeout(start, 5000);
            }
        }

        connection.onclose(async () => {
            statusEl.textContent = "Desconectado";
            statusEl.style.color = "red";
            log("Conexión cerrada. Reintentando...", 'error');
            await start();
        });

        start();
    </script>
</body>
</html>
